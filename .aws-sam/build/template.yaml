AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'salmak

  Sample SAM Template for salmak

  '
Globals:
  Function:
    Timeout: 20
    MemorySize: 512
  Api:
    Cors:
      AllowMethods: '''GET,POST,OPTIONS'''
      AllowHeaders: '''Content-Type'''
      AllowOrigin: '''*'''
Resources:
  SalmakFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: SalmakFunction
      Handler: com.salmak.App::handleRequest
      Runtime: java21
      Architectures:
      - x86_64
      MemorySize: 512
      Environment:
        Variables:
          PARAM1: VALUE
          TABLE_NAME: Salmak-Users
      Policies:
      - DynamoDBCrudPolicy:
          TableName: Salmak-Users
      Events:
        RegisterUser:
          Type: Api
          Properties:
            Path: /register
            Method: post
        RegisterUserOptions:
          Type: Api
          Properties:
            Path: /register
            Method: options
        GetUser:
          Type: Api
          Properties:
            Path: /user/{phoneNumber}
            Method: get
        GetUserOptions:
          Type: Api
          Properties:
            Path: /user/{phoneNumber}
            Method: options
        PostAlert:
          Type: Api
          Properties:
            Path: /alert
            Method: post
        PostAlertOptions:
          Type: Api
          Properties:
            Path: /alert
            Method: options
        GetAlert:
          Type: Api
          Properties:
            Path: /alert/{phoneNumber}
            Method: get
        GetAlertOptions:
          Type: Api
          Properties:
            Path: /alert/{phoneNumber}
            Method: options
        PostSafe:
          Type: Api
          Properties:
            Path: /safe
            Method: post
        PostSafeOptions:
          Type: Api
          Properties:
            Path: /safe
            Method: options
    Metadata:
      SamResourceId: SalmakFunction
Outputs:
  SalmakApi:
    Description: API Gateway endpoint URL for Prod stage for Salmak function
    Value:
      Fn::Sub: https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/register/
  SalmakFunction:
    Description: Salmak Lambda Function ARN
    Value:
      Fn::GetAtt:
      - SalmakFunction
      - Arn
  SalmakFunctionIamRole:
    Description: Implicit IAM Role created for Salmak function
    Value:
      Fn::GetAtt:
      - SalmakFunctionRole
      - Arn
